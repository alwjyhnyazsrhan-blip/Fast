name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: List files to find project directory
      run: |
        echo "--- Root Files ---"
        ls -la
        echo "--- Finding build.gradle files ---"
        find . -name "build.gradle" -o -name "build.gradle.kts"
