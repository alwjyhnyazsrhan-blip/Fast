name: Build Android APK via Capacitor

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install Dependencies & Build Web
      run: |
        npm install
        npm run build

    - name: Add Capacitor Android & Build APK
      run: |
        # تثبيت أدوات كاباسيتور إذا لم تكن موجودة وتوليد منصة أندرويد
        npx cap init LocateGo com.locate.go --web-dir=dist --yes || true
        npx cap add android
        npx cap sync android
        
        # الانتقال لمجلد أندرويد وبناء الـ APK
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: android/app/build/outputs/apk/debug/app-debug.apk
